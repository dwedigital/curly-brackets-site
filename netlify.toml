# Netlify configuration for Next.js static export
# 
# IMPORTANT: To use GitHub Actions for deployments, you must disable automatic deployments in Netlify:
# 1. Go to your Netlify site dashboard → Deploys
# 2. Click "Stop auto publishing" to prevent automatic deployments
# 3. This allows GitHub Actions to control when deployments happen

[build]
  command = "npm run build"
  publish = "out"

# Handle Next.js routing - redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

