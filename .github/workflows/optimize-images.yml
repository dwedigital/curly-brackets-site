name: Optimize Images

on:
  push:
    branches: [main]
    paths:
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.jpeg'
      - 'public/**/*.gif'
  workflow_dispatch:

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    # Skip if this is the auto-commit from image optimization
    if: contains(github.event.head_commit.message, '🖼️ Auto-optimize images to WebP') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Optimize images
        run: npm run optimize-images
        
      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🖼️ Auto-optimize images to WebP"
          file_pattern: 'public/**/*.webp'

