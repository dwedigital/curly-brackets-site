name: Build and Deploy

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    # Skip if this is the auto-commit from image optimization
    if: contains(github.event.head_commit.message, '🖼️ Auto-optimize images to WebP') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Optimize images
        run: npm run optimize-images
        
      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🖼️ Auto-optimize images to WebP"
          file_pattern: 'public/**/*.webp'

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: optimize-images
    # Run even if optimize-images was skipped or failed
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Get latest commit (in case optimize-images committed changes)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        # Ensure we have the latest commit in case optimize-images committed changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

