name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    # Skip if this is the auto-commit from image optimization
    if: contains(github.event.head_commit.message, '🖼️ Auto-optimize images to WebP') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Optimize images
        run: npm run optimize-images
        
      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🖼️ Auto-optimize images to WebP"
          file_pattern: 'public/**/*.webp'

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: optimize-images
    # Run even if optimize-images was skipped or failed
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Get latest commit (in case optimize-images committed changes)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        # Ensure we have the latest commit in case optimize-images committed changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=out --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

