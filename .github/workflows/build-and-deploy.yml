name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.jpeg'
      - 'public/**/*.gif'
      - 'posts/**/*.md'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    # Skip if this is the auto-commit from image optimization
    if: contains(github.event.head_commit.message, '🖼️ Auto-optimize images to WebP') == false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2
        
      - name: Check if this commit contains image files
        id: check-commit
        run: |
          echo "Checking what files were added/modified in commit: ${{ github.sha }}"
          
          # Get files added/modified in this specific commit
          COMMIT_FILES=$(git show --name-only --pretty=format: --diff-filter=AM ${{ github.sha }} 2>/dev/null | grep -v '^$' || echo "")
          
          if [ -z "$COMMIT_FILES" ]; then
            # Fallback: check diff between HEAD and HEAD~1
            COMMIT_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          
          echo "Files in this commit:"
          echo "$COMMIT_FILES" || echo "Could not determine files"
          
          # Check if any files in this commit are image files in public directory
          IMAGE_FILES=$(echo "$COMMIT_FILES" | grep -E '^public/.*\.(png|jpg|jpeg|gif)$' || echo "")
          HAS_IMAGES=$([ -n "$IMAGE_FILES" ] && echo "true" || echo "false")
          
          echo "Image files in this commit:"
          echo "$IMAGE_FILES" || echo "None"
          echo "has_images=$HAS_IMAGES" >> $GITHUB_OUTPUT
          
          if [ "$HAS_IMAGES" = "false" ]; then
            echo "✓ No image files in this commit - skipping optimization"
          else
            echo "✓ Found image files in this commit - will optimize"
          fi
        
      - name: Setup Node.js
        if: steps.check-commit.outputs.has_images == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        if: steps.check-commit.outputs.has_images == 'true'
        run: npm ci
        
      - name: Check for images to optimize
        if: steps.check-commit.outputs.has_images == 'true'
        id: check-images
        run: |
          echo "Checking for images to optimize..."
          IMAGES=$(find public -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" \) 2>/dev/null | wc -l)
          echo "Found $IMAGES images to process"
          echo "has_images=$([ $IMAGES -gt 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          if [ $IMAGES -eq 0 ]; then
            echo "No images found to optimize, skipping optimization step"
          fi
        
      - name: Optimize images
        if: steps.check-images.outputs.has_images == 'true'
        run: npm run optimize-images
        
      - name: Check for WebP files before commit
        if: steps.check-images.outputs.has_images == 'true'
        run: |
          echo "Checking for WebP files..."
          find public -name "*.webp" -type f -newer "$(git log -1 --format=%ct)" 2>/dev/null | head -10 || echo "No new WebP files found"
          echo "Git status before commit:"
          git status --short || true
        
      - name: Commit optimized images
        if: steps.check-images.outputs.has_images == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🖼️ Auto-optimize images to WebP"
          file_pattern: 'public/**/*.webp'
          commit_options: '--no-verify'
          skip_dirty_check: true

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: optimize-images
    # Only deploy if commit message contains [deploy] or [publish]
    # This allows you to control when deployments happen
    # Example: "Add new post [deploy]" or "Update content [publish]"
    if: |
      always() && 
      (contains(github.event.head_commit.message, '[deploy]') || 
       contains(github.event.head_commit.message, '[publish]') ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Check deployment trigger
        run: |
          echo "Deployment triggered by:"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -q '\[deploy\]'; then
            echo "  ✓ Commit message contains [deploy]"
          elif echo "$COMMIT_MSG" | grep -q '\[publish\]'; then
            echo "  ✓ Commit message contains [publish]"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "  ✓ Manual workflow dispatch"
          fi
          echo "Commit message: $COMMIT_MSG"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always checkout the latest from the branch (includes WebP commits from optimize-images)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Wait for optimize-images commit (if any)
        # Give a moment for the optimize-images commit to be available
        run: |
          echo "Waiting for any pending commits..."
          sleep 5
          git fetch origin ${{ github.ref_name }} || true

      - name: Pull latest changes
        # Ensure we have the latest commit including any WebP files from optimize-images
        run: |
          git pull origin ${{ github.ref_name }} || true
          echo "Latest commit: $(git log -1 --oneline)"
          echo "Checking for WebP images:"
          ls -la public/images/posts/*.webp 2>/dev/null | head -5 || echo "No WebP images found yet"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found after build"
            exit 1
          fi
          echo "Build output verified: $(ls -la out | head -10)"

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=out --prod --message="Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

