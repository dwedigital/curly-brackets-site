name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.jpeg'
      - 'public/**/*.gif'
      - 'posts/**/*.md'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    # Only run if [deploy] or [publish] is in commit message
    # Skip if this is the auto-commit from image optimization
    if: |
      (contains(github.event.head_commit.message, '[deploy]') || 
       contains(github.event.head_commit.message, '[publish]') ||
       github.event_name == 'workflow_dispatch') &&
      contains(github.event.head_commit.message, '🖼️ Auto-optimize images to WebP') == false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check for images to optimize
        id: check-images
        run: |
          echo "Checking for images to optimize (checking all images, not just this commit)..."
          IMAGES=$(find public -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" \) 2>/dev/null | wc -l)
          echo "Found $IMAGES images to process"
          echo "has_images=$([ $IMAGES -gt 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          if [ $IMAGES -eq 0 ]; then
            echo "No images found to optimize"
          else
            echo "Will optimize $IMAGES images"
          fi
        
      - name: Optimize images
        if: steps.check-images.outputs.has_images == 'true'
        run: npm run optimize-images
        
      - name: Check changes before commit
        if: steps.check-images.outputs.has_images == 'true'
        run: |
          echo "Checking for changes..."
          echo "New WebP files:"
          find public -name "*.webp" -type f 2>/dev/null | head -10 || echo "No WebP files found"
          echo ""
          echo "Git status (showing all changes including deletions):"
          git status --short || true
          echo ""
          echo "Deleted files:"
          git status --short | grep '^ D' || echo "No deletions"
        
      - name: Commit optimized images and deletions
        if: steps.check-images.outputs.has_images == 'true'
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage all changes in public directory (including deletions)
          git add -A public/
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          echo "Changes to be committed:"
          git status --short
          
          # Commit the changes
          git commit -m "🖼️ Auto-optimize images to WebP" --no-verify || exit 0
          
          # Push the commit
          git push || echo "Push failed or no changes to push"

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: optimize-images
    # Only deploy if commit message contains [deploy] or [publish]
    # This allows you to control when deployments happen
    # Example: "Add new post [deploy]" or "Update content [publish]"
    if: |
      always() && 
      (contains(github.event.head_commit.message, '[deploy]') || 
       contains(github.event.head_commit.message, '[publish]') ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Check deployment trigger
        run: |
          echo "Deployment triggered by:"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -q '\[deploy\]'; then
            echo "  ✓ Commit message contains [deploy]"
          elif echo "$COMMIT_MSG" | grep -q '\[publish\]'; then
            echo "  ✓ Commit message contains [publish]"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "  ✓ Manual workflow dispatch"
          fi
          echo "Commit message: $COMMIT_MSG"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always checkout the latest from the branch (includes WebP commits from optimize-images)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Wait for optimize-images commit (if any)
        # Give a moment for the optimize-images commit to be available
        run: |
          echo "Waiting for any pending commits..."
          sleep 5
          git fetch origin ${{ github.ref_name }} || true

      - name: Pull latest changes
        # Ensure we have the latest commit including any WebP files from optimize-images
        run: |
          git pull origin ${{ github.ref_name }} || true
          echo "Latest commit: $(git log -1 --oneline)"
          echo "Checking for WebP images:"
          ls -la public/images/posts/*.webp 2>/dev/null | head -5 || echo "No WebP images found yet"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found after build"
            exit 1
          fi
          echo "Build output verified: $(ls -la out | head -10)"

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=out --prod --message="Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

