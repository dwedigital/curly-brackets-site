name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    # Skip if this is the auto-commit from image optimization
    if: contains(github.event.head_commit.message, '🖼️ Auto-optimize images to WebP') == false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Optimize images
        run: npm run optimize-images
        
      - name: Check for WebP files before commit
        run: |
          echo "Checking for WebP files..."
          find public -name "*.webp" -type f | head -10 || echo "No WebP files found"
          echo "Git status before commit:"
          git status --short || true
        
      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🖼️ Auto-optimize images to WebP"
          file_pattern: 'public/**/*.webp'
          commit_options: '--no-verify'
          skip_dirty_check: true

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: optimize-images
    # Run even if optimize-images was skipped or failed
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always checkout the latest from the branch (includes WebP commits from optimize-images)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Wait for optimize-images commit (if any)
        # Give a moment for the optimize-images commit to be available
        run: |
          echo "Waiting for any pending commits..."
          sleep 5
          git fetch origin ${{ github.ref_name }} || true

      - name: Pull latest changes
        # Ensure we have the latest commit including any WebP files from optimize-images
        run: |
          git pull origin ${{ github.ref_name }} || true
          echo "Latest commit: $(git log -1 --oneline)"
          echo "Checking for WebP images:"
          ls -la public/images/posts/*.webp 2>/dev/null | head -5 || echo "No WebP images found yet"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found after build"
            exit 1
          fi
          echo "Build output verified: $(ls -la out | head -10)"

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=out --prod --message="Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

