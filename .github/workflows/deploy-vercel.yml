name: Vercel Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_run:
    workflows: ["Optimize Images"]
    types:
      - completed
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.jpeg'
      - 'public/**/*.gif'

jobs:
  Deploy-Production:
    # Deploy in these cases:
    # 1. Optimization workflow completed successfully (workflow_run trigger)
    # 2. Push to main (will wait for optimize-images if it's running)
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Optimize Images workflow to complete
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            // Small delay to allow optimize-images workflow to start if it was triggered
            console.log('Checking for Optimize Images workflow...');
            await new Promise(resolve => setTimeout(resolve, 5000)); // Wait 5 seconds initially
            
            // Check if Optimize Images workflow is running for this commit or recent commits
            let runningWorkflow = null;
            let checkAttempts = 0;
            const maxCheckAttempts = 3; // Check up to 3 times with delays
            
            while (!runningWorkflow && checkAttempts < maxCheckAttempts) {
              const { data: workflows } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'optimize-images.yml',
                branch: context.ref.replace('refs/heads/', ''),
                per_page: 5
              });
              
              // Find any running optimize-images workflows
              runningWorkflow = workflows.workflow_runs.find(
                run => run.status === 'in_progress' || run.status === 'queued'
              );
              
              if (!runningWorkflow && checkAttempts < maxCheckAttempts - 1) {
                checkAttempts++;
                console.log(`No running workflow found, checking again in 5 seconds... (attempt ${checkAttempts}/${maxCheckAttempts})`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              } else {
                break;
              }
            }
            
            if (runningWorkflow) {
              console.log(`Found Optimize Images workflow ${runningWorkflow.id} with status: ${runningWorkflow.status}`);
              console.log(`Workflow triggered by commit: ${runningWorkflow.head_sha.substring(0, 7)}`);
              console.log(`Current commit: ${context.sha.substring(0, 7)}`);
              console.log('Waiting for Optimize Images workflow to complete...');
              
              // Wait for workflow to complete
              let completed = false;
              let attempts = 0;
              const maxAttempts = 60; // 10 minutes max wait
              
              while (!completed && attempts < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 10000)); // Wait 10 seconds
                
                const { data: updatedRun } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runningWorkflow.id
                });
                
                if (updatedRun.status === 'completed') {
                  completed = true;
                  console.log(`Optimize Images workflow completed with status: ${updatedRun.conclusion}`);
                  if (updatedRun.conclusion !== 'success') {
                    console.log('Optimize Images workflow failed, but continuing deployment...');
                  }
                } else {
                  attempts++;
                  console.log(`Still waiting... (attempt ${attempts}/${maxAttempts})`);
                }
              }
              
              if (!completed) {
                console.log('Timeout waiting for Optimize Images workflow, proceeding with deployment...');
              }
            } else {
              console.log('No running Optimize Images workflow found, proceeding with deployment...');
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, checkout the commit from the triggering workflow
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          # Use the commit SHA from the triggering workflow
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

